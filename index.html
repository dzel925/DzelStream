    <style>
        :root {

            --bg-soft: #101319;

<body class="min-h-screen flex flex-col antialiased selection:bg-brand-crimson selection:text-white">

    <header class="site-header">
        <div class="site-header-inner">
            <button class="topbar-button" type="button" onclick="toggleNavigationDrawer()" aria-label="Open navigation" aria-controls="navigationDrawer" aria-expanded="false" id="menuButton">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="topbar-button" type="button" onclick="goBack()" aria-label="Go back">

            </button>
            <a href="#" onclick="switchMediaType('movie'); switchTab('trending'); return false;" class="header-brand" aria-label="DzelStream home">

            </a>
            <div class="sidebar-search topbar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search movies, TV shows..." oninput="handleSearchInput(event)">
                <button id="clearSearchBtn" class="hidden" onclick="clearSearch()">

                </button>
            </div>
            <button class="topbar-button" type="button" onclick="toggleTheme()" aria-label="Toggle color theme" id="themeButton">

    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeNavigationDrawer()"></div>

            <a href="#" onclick="switchMediaType('movie'); switchTab('trending'); closeNavigationDrawer(); return false;" class="brand" aria-label="DzelStream home">
                <img src="assets/dzelstream-logo.webp" alt="DzelStream">
            </a>
        </div>
        <nav class="sidebar-nav">

                    <i class="fa-solid fa-film"></i> Movies
                </button>

                </button>

    <script>
        let currentMediaType = 'movie'; // 'movie' or 'tv'
        let currentTab = 'trending';
        let watchlist = JSON.parse(localStorage.getItem('cinestream_watchlist')) || [];
        
        let activeMediaItem = null;
        let detailsRequestId = 0;
        let searchQuery = '';
        let selectedSeason = 1;
        let currentStreamServer = 'multiembed';

        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            updateWatchlistBadge();
            renderHome();
        });
        window.addEventListener('pageshow', () => {
            if (currentTab === 'trending') window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        });

        function toggleNavigationDrawer() {
            const drawer = document.getElementById('navigationDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const button = document.getElementById('menuButton');
            const isOpen = drawer.classList.toggle('is-open');
            backdrop.classList.toggle('is-open', isOpen);
            drawer.setAttribute('aria-hidden', String(!isOpen));
            button.setAttribute('aria-expanded', String(isOpen));
            document.body.style.overflow = isOpen ? 'hidden' : '';
        }

        function closeNavigationDrawer() {
            const drawer = document.getElementById('navigationDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const button = document.getElementById('menuButton');
            if (!drawer || !backdrop || !button) return;
            drawer.classList.remove('is-open');
            backdrop.classList.remove('is-open');
            drawer.setAttribute('aria-hidden', 'true');

        async function fetchTMDB(endpoint, params = {}) {
            const urlParams = new URLSearchParams({ language: 'en-US', ...params });
            const apiBase = window.location.protocol === 'file:'
                ? 'http://localhost:3000/api/tmdb'
                : '/api/tmdb';
            try {
                const res = await fetch(`${apiBase}${endpoint}?${urlParams.toString()}`);
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.status_message || data.error || `TMDB proxy error ${res.status}`);
                }
                return data;
            } catch (err) {
                console.error('TMDB API request failed:', err);
                const message = err instanceof TypeError
                    ? window.location.protocol === 'file:'
                        ? "Can't reach DzelStream's server at http://localhost:3000. Start it with npm start to load movies."
                        : "Can't reach DzelStream's server. Run npm start and open http://localhost:3000."
                    : err instanceof Error ? err.message : 'TMDB API request failed.';
                showToast(message, 'error');
                return null;
            }
        }

        async function fetchTMDBPages(endpoint, params = {}, pageCount = 5) {
            const firstPage = await fetchTMDB(endpoint, { ...params, page: 1 });
            if (!firstPage || !Array.isArray(firstPage.results)) return null;

            const pagesToLoad = Math.min(pageCount, firstPage.total_pages || pageCount);
            const remainingPages = await Promise.all(
                Array.from({ length: pagesToLoad - 1 }, (_, index) =>
                    fetchTMDB(endpoint, { ...params, page: index + 2 })
                )
            );
            const results = [firstPage, ...remainingPages]
                .filter(page => page && Array.isArray(page.results))
                .flatMap(page => page.results)
                .slice(0, 100);

            return { ...firstPage, results };
        }

        async function loadGenreCollection(genre) {
            const targetType = currentMediaType;
            const movieGenreMap = {
                'Action': 28, 'Adventure': 12, 'Animation': 16, 'Comedy': 35,
                'Crime': 80, 'Drama': 18, 'Fantasy': 14, 'Horror': 27,
                'Mystery': 9648, 'Romance': 10749, 'Sci-Fi': 878, 'Thriller': 53
            };
            const tvGenreMap = {
                'Action': 10759, 'Adventure': 10759, 'Animation': 16, 'Comedy': 35,
                'Crime': 80, 'Documentary': 99, 'Drama': 18, 'Family': 10751,
                'Kids': 10762, 'Mystery': 9648, 'Reality': 10764, 'Sci-Fi & Fantasy': 10765
            };
            const genreId = (targetType === 'movie' ? movieGenreMap : tvGenreMap)[genre];
            if (!genreId) {
                showToast(`The ${genre} genre is not available for this media type.`, 'error');
                return;
            }
            try {
                const data = await fetchTMDBPages(`/discover/${targetType}`, { with_genres: genreId });
                if (!data) throw new Error('Genre search failed through TMDB.');
                const results = (data.results || []).filter(item => item && (item.title || item.name));
                const main = document.getElementById('mainContent');
                main.innerHTML = `
                    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-8 sm:pt-12 space-y-6 sm:space-y-8 animate-fade-in">

                                <p class="text-xs text-slate-400 mt-1">${results.length} results in ${targetType === 'movie' ? 'movies' : 'TV shows'}</p>
                            </div>
                        </div>
                        <div id="genreCollectionGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-6"></div>
                    </div>
                `;
                renderMediaGridToContainer(results, 'genreCollectionGrid');
            } catch (err) {
                console.error(err);
                showToast('Could not load this genre.', 'error');
            }
        }

            if (container.isConnected && container.dataset.requestId === String(requestId) && seasonData && seasonData.episodes) {
                container.innerHTML = seasonData.episodes.map(ep => `
                    <div onclick="openWatchPage(${tvId}, 'tv', ${seasonNum}, ${ep.episode_number})" class="bg-slate-900/80 hover:bg-slate-900 border border-brand-border hover:border-brand-crimson/50 rounded-xl p-2.5 sm:p-3 flex gap-2.5 sm:gap-3 cursor-pointer transition-all group">

                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-bold text-brand-crimson">EP ${ep.episode_number}</span>
                                <span class="text-[10px] text-slate-500">${ep.runtime ? ep.runtime + 'm' : ''}</span>
                            </div>
                            <h4 class="text-white font-bold text-xs truncate mt-0.5">${escapeHtml(ep.name)}</h4>
                            <p class="text-slate-400 text-[10px] line-clamp-2 mt-1 leading-relaxed">${escapeHtml(ep.overview || 'No overview available.')}</p>

        }

        function openWatchPage(id, type, season = 1, episode = 1) {
            currentTab = 'watch';
            selectedSeason = season;
            if (currentStreamServer === 'youtube-trailer') currentStreamServer = 'multiembed';

            let mediaItem = activeMediaItem && activeMediaItem.id === id && activeMediaItem.media_type === type
                ? activeMediaItem
                : null;
            let continueWatching = JSON.parse(localStorage.getItem('cinestream_continue_watching')) || [];
            if (!mediaItem) {
                mediaItem = continueWatching.find(item => item.id === id && item.media_type === type) || null;
            }
            if (mediaItem) {
                activeMediaItem = mediaItem;
                continueWatching = continueWatching.filter(item => item.id !== id || item.media_type !== type);
                continueWatching.unshift({
                    id: mediaItem.id,
                    title: mediaItem.title || mediaItem.name,
                    poster_path: mediaItem.poster_path,
                    vote_average: mediaItem.vote_average,
                    release_date: mediaItem.release_date || mediaItem.first_air_date,
                    media_type: type,
                    season: season,
                    episode: episode,
                    updatedAt: Date.now()
                });
                if (continueWatching.length > 10) continueWatching.pop();
                localStorage.setItem('cinestream_continue_watching', JSON.stringify(continueWatching));
            }

            const main = document.getElementById('mainContent');
            const title = escapeHtml(mediaItem ? (mediaItem.title || mediaItem.name) : 'Streaming Player');

            main.innerHTML = `
                <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-5 sm:pt-6 space-y-5 sm:space-y-6 animate-fade-in">
                    <div class="flex items-center justify-between">
                        <button onclick="${mediaItem ? `openDetailsPage(${id}, '${type}')` : `renderHome()`}" class="flex items-center space-x-2 text-xs font-bold text-slate-400 hover:text-white transition-colors bg-brand-card px-3.5 sm:px-4 py-2 rounded-xl border border-brand-border">
                            <i class="fa-solid fa-arrow-left"></i><span>Back</span>
                        </button>
                        <div class="text-right">
                            <h2 class="text-sm sm:text-base font-black text-white truncate max-w-md">${title} ${type === 'tv' ? `<span class="text-brand-crimson ml-2">S${season} E${episode}</span>` : ''}</h2>
                        </div>
                    </div>

                    <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-brand-border">
                        <iframe id="videoPlayerFrame" data-media-id="${id}" data-media-type="${type}" title="${title} player" src="${getEmbedUrl(id, type, season, episode, currentStreamServer)}" class="w-full h-full" frameborder="0" scrolling="no" webkitallowfullscreen mozallowfullscreen allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *"></iframe>
                    </div>

                    <div class="glass-panel p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
                        <div>
                            <h4 class="text-sm font-bold text-white flex items-center"><i class="fa-solid fa-server text-brand-crimson mr-2"></i> Streaming Servers</h4>
                            <p class="text-xs text-slate-400 mt-0.5">Tap Play in the video to start. YouTube Trailer is an official preview, not the full movie or episode.</p>
                        </div>
                        <div class="flex w-full sm:w-auto flex-wrap gap-2">
                            <button onclick="switchServer('vidsrc', ${id}, '${type}', ${season}, ${episode}, event)" class="server-btn flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold ${currentStreamServer === 'vidsrc' ? 'bg-brand-crimson text-white shadow-md shadow-brand-crimson/30' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'} transition-all">VidSrc ME</button>
                            <button onclick="switchServer('vidsrc-cc', ${id}, '${type}', ${season}, ${episode}, event)" class="server-btn flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold ${currentStreamServer === 'vidsrc-cc' ? 'bg-brand-crimson text-white shadow-md shadow-brand-crimson/30' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'} transition-all">VidSrc CC</button>
                            <button onclick="switchServer('embedsu', ${id}, '${type}', ${season}, ${episode}, event)" class="server-btn flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold ${currentStreamServer === 'embedsu' ? 'bg-brand-crimson text-white shadow-md shadow-brand-crimson/30' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'} transition-all">Embed.su</button>
                            <button onclick="switchServer('multiembed', ${id}, '${type}', ${season}, ${episode}, event)" class="server-btn flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold ${currentStreamServer === 'multiembed' ? 'bg-brand-crimson text-white shadow-md shadow-brand-crimson/30' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'} transition-all">MultiEmbed</button>
                            <button onclick="playYouTubeTrailer(${id}, '${type}', event)" class="trailer-btn flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold ${currentStreamServer === 'youtube-trailer' ? 'bg-brand-crimson text-white shadow-md shadow-brand-crimson/30' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'} transition-all"><i class="fa-brands fa-youtube mr-1"></i>YouTube Trailer</button>
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        function getEmbedUrl(id, type, season, episode, server) {
            if (server === 'vidsrc') {
                return type === 'movie' 
                    ? `https://vidsrc.me/embed/movie?tmdb=${id}` 
                    : `https://vidsrc.me/embed/tv?tmdb=${id}&season=${season}&episode=${episode}`;
            } else if (server === 'vidsrc-cc') {
                return type === 'movie'
                    ? `https://vidsrc.cc/v2/embed/movie/${id}`
                    : `https://vidsrc.cc/v2/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 'embedsu') {
                return type === 'movie'
                    ? `https://embed.su/embed/movie/${id}`
                    : `https://embed.su/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 'multiembed') {
                return type === 'movie'
                    ? `https://multiembed.mov/?video_id=${id}&tmdb=1`
                    : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${season}&e=${episode}`;
            }
            return `https://vidsrc.me/embed/movie?tmdb=${id}`;
        }

        function switchServer(serverKey, id, type, season, episode, event) {
            currentStreamServer = serverKey;
            setActiveSourceButton(event && event.currentTarget);
            
            const iframe = document.getElementById('videoPlayerFrame');
            if (iframe) {
                iframe.src = getEmbedUrl(id, type, season, episode, serverKey);
                showToast(`Switched to streaming server.`);
            }
        }

        async function playYouTubeTrailer(id, type, event) {
            const mediaItem = activeMediaItem && activeMediaItem.id === id && activeMediaItem.media_type === type
                ? activeMediaItem
                : null;
            const videoData = mediaItem && mediaItem.videos
                ? mediaItem.videos
                : await fetchTMDB(`/${type}/${id}/videos`);
            if (!videoData || !videoData.results) return;

            const trailer = videoData.results.find(video =>
                video.site === 'YouTube' &&
                video.type === 'Trailer' &&
                video.official &&
                video.key
            ) || videoData.results.find(video =>
                video.site === 'YouTube' &&
                video.type === 'Trailer' &&
                video.key
            );
            if (!trailer) {
                showToast('No YouTube trailer is available for this title.', 'error');
                return;
            }

            const iframe = document.getElementById('videoPlayerFrame');
            if (!iframe || iframe.dataset.mediaId !== String(id) || iframe.dataset.mediaType !== type) return;

            currentStreamServer = 'youtube-trailer';
            setActiveSourceButton(event && event.currentTarget);
            iframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(trailer.key)}?playsinline=1&rel=0`;
            showToast('Official trailer loaded. Tap Play to watch.');
        }

        function setActiveSourceButton(selectedButton) {
            const activeClass = selectedButton && selectedButton.classList.contains('trailer-btn')
                ? 'trailer-btn'
                : 'server-btn';
            document.querySelectorAll('.server-btn, .trailer-btn').forEach(button => {
                const buttonClass = button.classList.contains('trailer-btn') ? 'trailer-btn' : 'server-btn';
                button.className = `${buttonClass} flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 hover:bg-slate-800 transition-all`;
            });
            if (selectedButton) {
                selectedButton.className = `${activeClass} flex-1 sm:flex-none min-h-11 px-3.5 py-2 rounded-xl text-xs font-bold bg-brand-crimson text-white shadow-md shadow-brand-crimson/30 transition-all`;
            }
        }
    </script>
</body>
</html>
